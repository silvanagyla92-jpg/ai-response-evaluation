name: Atualizar rodapes do projeto

on:
  push:
    paths:
      - '.github/workflows/atualizar-rodapes.yml'

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar todos os rodapes Markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          FOOTER = '''**Projeto:** Avaliação de Resposta de IA

**Autora:** Nágyla Silva

Projeto integrante do portfólio prático em Inteligência Artificial,
desenvolvido para demonstrar competências em treinamento e avaliação de
sistemas de IA, análise crítica de respostas e anotação de dados, aplicadas às
funções de AI Trainer, AI Response Evaluator e Data Annotator, com base em
experiência em QA e Auditoria.'''

          root = Path('.')
          changed = []

          for path in sorted(root.rglob('*.md')):
              if path == root / 'README.md' or '.git' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              # Remove rodapes anteriores apenas no final do arquivo.
              patterns = [
                  r'\n(?:---\n\n)?\*\*Projeto:\*\*\s*(?:Avaliação de Resposta de IA|AI Response Evaluation).*\Z',
                  r'\n---\n\n\*Avaliação desenvolvida como parte do portfólio.*\Z',
                  r'\n---\n\n\*Projeto integrado do portfólio.*\Z',
              ]
              for pattern in patterns:
                  text = re.sub(pattern, '', text, flags=re.S)

              text = text.rstrip() + '\n\n---\n\n' + FOOTER + '\n'
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print(f'Arquivos atualizados: {len(changed)}')
          for item in changed:
              print(item)
          PY

      - name: Commit e push das alteracoes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.md'
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao necessaria.'
            exit 0
          fi
          git commit -m 'docs: atualizar rodapes para avaliacao de resposta de IA'
          git push

# padronizacao de rodapes - execucao unica
