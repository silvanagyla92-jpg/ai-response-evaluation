name: Padronizar rodapes dos documentos

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  padronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Padronizar rodapes Markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          footer = '''**Projeto:** AI Response Evaluation
**Autora:** Nágyla Silva

Projeto integrante do portfólio prático em Inteligência Artificial, desenvolvido para demonstrar competências em treinamento e avaliação de sistemas de IA, análise crítica de respostas e anotação de dados, aplicadas às funções de AI Trainer, AI Response Evaluator e Data Annotator, com base em experiência em QA e Auditoria.'''

          root = Path('.')
          for path in root.rglob('*.md'):
              if path.as_posix() == 'README.md':
                  continue

              text = path.read_text(encoding='utf-8')
              if footer in text:
                  continue

              text = text.rstrip() + '\n\n---\n\n' + footer + '\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Remover workflow temporario
        run: rm -f .github/workflows/padronizar-rodapes.yml

      - name: Commit das alteracoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git commit -m "docs: padronizar rodapes dos documentos"
          git push
