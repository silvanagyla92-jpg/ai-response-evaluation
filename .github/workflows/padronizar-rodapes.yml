name: Padronizar rodapes do projeto

on:
  push:
    paths:
      - '**.md'
      - '.github/workflows/padronizar-rodapes.yml'

permissions:
  contents: write

jobs:
  padronizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Padronizar rodapes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          footer = '''**Projeto:** Avaliação de Resposta de IA

**Autora:** Nágyla Silva

Projeto integrante do portfólio prático em Inteligência Artificial,
desenvolvido para demonstrar competências em treinamento e avaliação de
sistemas de IA, análise crítica de respostas e anotação de dados, aplicadas às
funções de AI Trainer, AI Response Evaluator e Data Annotator, com base em
experiência em QA e Auditoria.'''

          root = Path('.')
          for path in root.rglob('*.md'):
              if path == root / 'README.md' or '.git' in path.parts:
                  continue

              text = path.read_text(encoding='utf-8')
              original = text

              marker = re.search(r'(?m)^\*\*Projeto:\*\*\s*.*$', text)
              if marker:
                  text = text[:marker.start()].rstrip()
                  while text.endswith('---'):
                      text = text[:-3].rstrip()

              text = re.sub(r'\n---\n\n\*Avalia[^\n]*\n?$', '', text, flags=re.S).rstrip()
              text = text.rstrip() + '\n\n---\n\n' + footer + '\n'
              if text != original:
                  path.write_text(text, encoding='utf-8')
          PY

      - name: Commit e push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.md' '**/*.md'
          if git diff --cached --quiet; then
            echo 'Nenhuma alteracao necessaria.'
            exit 0
          fi
          git commit -m 'docs: padronizar rodapes das secoes e readmes'
          git push

# execucao de validacao da padronizacao
