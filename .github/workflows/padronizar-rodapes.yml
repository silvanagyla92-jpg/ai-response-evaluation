name: Padronizar rodapés

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  padronizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Padronizar rodapés dos Markdown
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          footer = '''**Projeto:** AI Response Evaluation
          **Autora:** Nágyla Silva

          Projeto integrante do portfólio prático em Inteligência Artificial, desenvolvido para demonstrar competências em treinamento e avaliação de sistemas de IA, análise crítica de respostas e anotação de dados, aplicadas às funções de AI Trainer, AI Response Evaluator e Data Annotator, com base em experiência em QA e Auditoria.'''.replace('          ', '')

          root = Path('.')
          for path in root.rglob('*.md'):
              if path.as_posix() == 'README.md':
                  continue

              text = path.read_text(encoding='utf-8').rstrip()

              # Remove rodapés padronizados anteriores, quando presentes no final.
              text = re.sub(
                  r'\n+---\n+\*\*(?:Autor|Projeto):\*\* Nágyla Silva.*?\Z',
                  '',
                  text,
                  flags=re.S,
              )

              # Remove uma ocorrência do rodapé antigo sem separador, se estiver no final.
              text = re.sub(
                  r'\n+\*\*Autor:\*\* Nágyla Silva\n+\*Projeto integrado do portfólio.*?\Z',
                  '',
                  text,
                  flags=re.S,
              )

              path.write_text(text.rstrip() + '\n\n---\n\n' + footer + '\n', encoding='utf-8')
          PY

      - name: Commitar rodapés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset .github/workflows/padronizar-rodapes.yml || true
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
            exit 0
          fi
          git commit -m "docs: padronizar rodapés das seções e READMEs"
          git push

      - name: Remover workflow temporário
        if: success()
        run: |
          git rm -f .github/workflows/padronizar-rodapes.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remover workflow temporário" || true
          git push || true
